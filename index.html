<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maafkan Aku Naya ✨</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>

        body {

            font-family: 'Inter', sans-serif;

            background-color: #fafafa;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            margin: 0;

            overflow: hidden;

        }

        .card {

            background: white;

            padding: 40px 25px;

            border-radius: 24px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.08);

            text-align: center;

            max-width: 360px;

            width: 88%;

            border: 1px solid #f0f0f0;

        }

        h1 {

            font-family: 'Dancing Script', cursive;

            color: #222;

            font-size: 32px;

            margin-bottom: 20px;

        }

        .message {

            color: #444;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 30px;

            text-align: center;

            padding: 0 10px;

        }

        .gif-box img {

            width: 130px;

            margin-bottom: 15px;

            border-radius: 12px;

        }

        .btn-group {

            display: flex;

            justify-content: center;

            gap: 15px;

            height: 45px;

            position: relative;

        }

        button {

            padding: 0 25px;

            font-size: 14px;

            font-weight: 600;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        }

        #yesBtn {

            background-color: #1a1a1a;

            color: white;

        }

        #noBtn {

            background-color: #f2f2f2;

            color: #777;

            position: absolute;

        }

    </style>

</head>

<body>



    <div class="card">

        <div class="gif-box">

            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHJreGZueGZ4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Panda Sad">

        </div>

        <h1>Maafkan Aku, Naya</h1>

        

        <div class="message">

            Naya, maafkan ka karena selalu nge-jokes dan kentut sembarangan. Maaf kalau karena itu kita merasa tersinggung dan tidak dihargai. <br><br>

            <i>Just want you to know that I feel bad for doing that and I'm feeling really sorry for that 😞 I miss u too.</i>

        </div>

        

        <div class="btn-group">

            <button id="yesBtn" onclick="accept()">Iya, dimaafin ✨</button>

            <button id="noBtn" onmouseover="moveButton()">Nggak!</button>

        </div>

    </div>



    <script>

        function moveButton() {

            const btn = document.getElementById('noBtn');

            const x = Math.random() * (window.innerWidth - btn.clientWidth);

            const y = Math.random() * (window.innerHeight - btn.clientHeight);

            

            btn.style.position = "fixed";

            btn.style.left = x + 'px';

            btn.style.top = y + 'px';

        }



        function accept() {

            alert("Terima kasih, Naya. Maaf ya sudah bikin nggak nyaman ❤️");

            // GANTI NOMOR DI BAWAH INI DENGAN NOMOR WA KAMU

            window.location.href = "https://wa.me/6282163444175?text=Iya+aku+maafin+kok+tadi+✨";

        }

    </script>

</body>

</html>
